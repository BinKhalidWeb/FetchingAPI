<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden Harvest - Premium Honey</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
        }

        .font-playfair {
            font-family: 'Playfair Display', serif;
        }

        .honeycomb-bg {
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 0h50v50H0V0zm0 50h50v50H0V50zM50 0h50v50H50V0zm0 50h50v50H50V50z' fill='%23f59e0b' fill-opacity='0.05' fill-rule='evenodd'/%3E%3C/svg%3E");
        }

        .nav-link::after {
            content: '';
            display: block;
            width: 0;
            height: 2px;
            background: #f59e0b;
            transition: width 0.3s;
        }

        .nav-link:hover::after {
            width: 100%;
        }

        .honey-drip {
            position: absolute;
            width: 80px;
            height: 120px;
            background: radial-gradient(ellipse at center, rgba(245, 158, 11, 0.8) 0%, rgba(245, 158, 11, 0) 70%);
            border-radius: 50%;
            filter: blur(5px);
            animation: drip 8s infinite ease-in-out;
        }

        @keyframes drip {

            0%,
            100% {
                transform: translateY(0) scale(1);
                opacity: 0.7;
            }

            50% {
                transform: translateY(20px) scale(0.95);
                opacity: 0.4;
            }
        }

        .honey-jar {
            transition: transform 0.5s ease;
        }

        .honey-jar:hover {
            transform: translateY(-10px) rotate(5deg);
        }
    </style>
</head>

<body class="bg-amber-50 text-amber-900 honeycomb-bg">

    <section class="relative bg-amber-50 overflow-hidden">

        <div class="absolute inset-0 opacity-10 honeycomb-bg"></div>

        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16 md:py-24">

            <div id="product-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
            </div>

        </div>

    </section>


    <script>

        async function getProducts() {

            const response = await fetch(
                "https://fakestoreapi.com/products"
            );

            const products = await response.json();

            const container =
                document.getElementById("product-container");

            container.innerHTML = products.map(product => {

                return `
                    <div class="bg-white rounded-xl shadow-md overflow-hidden">

                        <div class="h-64">
                            <img
                                src="${product.image}"
                                alt="${product.title}"
                                class="w-full h-full object-contain p-6"
                            >
                        </div>

                        <div class="p-6">

                            <h3 class="text-xl font-bold">
                                ${product.title}
                            </h3>

                            <p class="text-amber-600 font-bold mt-2">
                                $${product.price}
                            </p>

                            <p class="text-sm mt-3">
                                ${product.description}
                            </p>

                            <button class="mt-5 px-4 py-2 bg-amber-100 rounded-lg">
                                Add to Cart
                            </button>

                        </div>

                    </div>
                `;

            }).join("");

        }

        getProducts();

    </script>

</body>

</html>
